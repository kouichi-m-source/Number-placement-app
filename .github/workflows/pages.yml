name: Deploy web app (GitHub Pages)

# web/ フォルダの中身を GitHub Pages で公開する(iPad・ブラウザ版)。
# 初回だけ、リポジトリの Settings > Pages > Source を「GitHub Actions」にしてください。
on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Core logic tests (compared with the Windows version's results)
        run: node --test web/tests/core.test.mjs

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Remove test files from the published folder
        run: rm -rf web/tests
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
