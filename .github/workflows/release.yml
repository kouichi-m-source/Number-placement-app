name: Release

on:
  push:
    tags:
      - "V*"
  workflow_dispatch:
    inputs:
      tag:
        description: "既存のリリースのタグ(例 V1.0.3)。入れると、そのリリースの exe だけを最新のコードで入れ替える(タイトル・説明・タグは変えない)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Build exe
        # PyMuPDF は DLL・pyd だけを同梱する(レイアウト解析用のモデルなど不要なファイルで約3倍に膨らむため)
        run: pyinstaller --onefile --windowed --icon icon.ico --name number-placement-app --collect-binaries pymupdf --hidden-import fitz --hidden-import pymupdf zumen_annot.pyw

      - name: Self-test the built exe (Tk / Pillow / PDF)
        shell: pwsh
        run: |
          $exe = "dist\number-placement-app.exe"
          $mb = [math]::Round((Get-Item $exe).Length / 1MB, 1)
          Write-Host "::notice title=exe size::$mb MB"
          $p = Start-Process -FilePath $exe -ArgumentList "--selftest","selftest.txt" -Wait -PassThru
          $txt = if (Test-Path selftest.txt) { Get-Content selftest.txt -Raw } else { "(selftest.txt was not created)" }
          Write-Host $txt
          $one = $txt -replace "`r?`n", "%0A"
          Write-Host "::notice title=selftest exit=$($p.ExitCode)::$one"
          if ($p.ExitCode -ne 0) { throw "self-test failed (exit code $($p.ExitCode))" }

      - name: Upload artifact (manual runs)
        uses: actions/upload-artifact@v4
        with:
          name: number-placement-app
          path: dist/number-placement-app.exe

      - name: Replace exe of an existing release (manual runs with a tag)
        if: github.event_name == 'workflow_dispatch' && inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: dist/number-placement-app.exe
          fail_on_unmatched_files: true

      - name: Attach to release (tag runs)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: 番号配置アプリ ${{ github.ref_name }}
          body: |
            図面(PDF・画像)に〇付きの番号と矢印を配置するアプリです。

            ## ダウンロード
            下の **Assets** にある **number-placement-app.exe** をクリックすると、ダウンロードが始まります。
            Python のインストールは不要です。ダウンロードした exe をダブルクリックで起動します。

            ## 初めて起動するとき
            Windows の警告画面(「WindowsによってPCが保護されました」)が出ることがあります。
            その場合は **「詳細情報」→「実行」** をクリックしてください。
            この exe はコード署名をしていないため、表示されます。

            ## 使い方
            使い方は [README](https://github.com/${{ github.repository }}#readme) をご覧ください。
          files: dist/number-placement-app.exe
          fail_on_unmatched_files: true
